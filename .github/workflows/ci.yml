name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # CI ではビルド・E2E に実接続しないためダミー値を使う
  SUPABASE_URL: http://127.0.0.1:54321
  SUPABASE_ANON_KEY: ci-dummy-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key
  AUTH_SECRET: ci-dummy-auth-secret-32-characters!!
  AUTH_GOOGLE_ID: ci-dummy-google-id
  AUTH_GOOGLE_SECRET: ci-dummy-google-secret

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
